# team.yaml — the one config file you edit.
# Roles -> vendors -> budgets. Vendor names: mock, claude-cli, codex-cli,
# gemini-cli, or any CLI you declare under `vendors:` below (there are no
# built-in api:* vendors; a hosted API can be reached through a CLI). The
# auditor must not be the vendor that engineered the change; if both name the
# same vendor, the loop runs the audit in a fresh context and flags the
# verdict (see docs/SPEC.md).

pack: software

# The git repository the team edits (relative to this folder, or absolute).
# It must be a clean git repo: the loop resets
# and cleans it after every cycle. The demo workspace is created by prepare.py.
workspace: .keeploop/workspace

# Comma-separated paths or globs inside the workspace that no change may touch
# (a diff touching one is a crash plus a lesson). Case-insensitive; no absolute
# paths or `..`. Example:
# protect: tests, evaluate.py, *.lock

# Globs (same rules as protect) that make a change "heavy": the confirm re-run
# is forced and the auditor uses its heavy_model. A diff over loop heavy_diff_lines
# lines is heavy too. Default when absent: manifests, lockfiles, Dockerfile, CI,
# migrations. `heavy:` with no value means size only.
# heavy: requirements*.txt, pyproject.toml, *.lock, migrations/*

# Per role, optional: model (passed to the CLI as --model) and, for the auditor,
# heavy_model. Letters, digits and . _ : / - only. Applies to every CLI in a
# `vendor: a, b` fallback list, so set it for single-vendor roles.
# Any other CLI can serve a role with no code change. The prompt goes on stdin,
# no shell is used, secret-looking env vars are scrubbed except those under
# env_keep prefixes (the CLI's own API key). The flags below are placeholders:
# CHECK YOUR CLI'S DOCS for its non-interactive flag, its edit-permission flag
# and its model flag. Then use `vendor: myvendor` in a role.
# vendors:
#   myvendor:
#     cmd: mycli --print          # binary plus the flag that reads stdin and prints
#     edit_args: --allow-edits    # added for the engineer only
#     model_flag: --model
#     env_keep: MYVENDOR_

# Staffing (used only by `kl staff --apply`; delete to forbid auto-edits). It may
# set roles.<name>.model / heavy_model from allow_models and token_budget up to
# max_tokens_per_role. It never touches loop.max_run_tokens or anything else.
# staffing:
#   allow_models: model-a, model-b     # cheapest first
#   max_tokens_per_role: 60000

# Optional: run this command instead of `python evaluate.py <workspace>` (JS, Go,
# Rust, ...). argv via shlex, no shell, cwd = the workspace, same timeout, fence and
# scrubbed env. The metric is the LAST non-empty stdout line (a float, higher is
# better); non-zero exit, timeout or anything else is an evaluation crash. holdout.py
# is not replaced. No `#` in the value; on Windows write paths with /. If the value
# starts and ends with a quote, wrap all of it in one more pair of quotes. On
# Windows, launchers such as npm need their full name (npm.cmd).
# eval_cmd: npm test --silent

# Cost routing, guidance only (nothing is switched for you). Spend where a mistake is
# expensive, save where it is cheap:
# - scout, analyst drafts, engineer on small light diffs: a cheap, fast model;
# - auditor (and its heavy_model): the strongest model you have. It is the one fresh
#   pair of eyes between a diff and a commit, and it runs only when the metric beats
#   the bar, so it is called on a minority of cycles;
# - evaluation: a deterministic evaluate.py costs no tokens; `kl doctor` tells you
#   whether repeats are worth their time.
# `kl staff --goal cost` proposes such a staffing; `kl slow` shows where the time goes.

roles:
  analyst:
    vendor: mock
    token_budget: 30000
  engineer:
    vendor: mock
    token_budget: 50000
  auditor:
    vendor: mock
    token_budget: 30000

loop:
  max_iterations: 20
  keep_threshold: 0.0
  # metric_max: 1.0      # top of evaluate.py's scale: warns when the keep bar is above it
  # target: 0.9          # good enough: once best reaches it, no new card and run.py stops
  # stall_cycles: 5      # this many cycles in a row without a keep: the same brake (0 = off)
  # noise_runs: 5        # baseline evaluations that measure sigma, once per loop (default 5; `kl doctor` advises)
  # eval_cache: true     # reuse a score for identical files + evaluate.py; only when sigma is 0
  # profile: fast       # fewer AI calls and tokens: the engineer writes the card itself
                         # (fused), program.md hypotheses become cards with no call
                         # (auto_cards), leaner prompts. Same keep law. docs/SPEC.md §4

# Optional, off by default: lessons shared across your projects. `kl lesson share L-ID`
# copies one lesson to ~/.keeploop/lessons/lessons.jsonl (a human decision). With
# enabled: true, `kl recall` and each headless cycle also read the most relevant shared
# lessons: at most max_lessons (5 is the hard cap) within max_tokens (chars / 4).
# global_lessons:
#   enabled: true
#   max_lessons: 3
#   max_tokens: 400

# Optional: flag cycles slower than this many seconds in `kl report`, and use it as
# the target `kl slow` proposes for a lesson check. Default: none.
# cycle_time_budget_s: 300
