<!doctype html>
<!-- Source for the brand images. Render with a 2x device scale and screenshot the element:
       banner.html?theme=dark|light            #banner  1280x400  -> banner-dark.png / banner-light.png
       banner.html?view=logo&theme=dark|light  #logo    512x512   -> logo-dark.png / logo-light.png
       banner.html?view=social                 #social  1280x640  -> social-preview.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keeploop brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&display=block" rel="stylesheet">
<style>
  :root { --ground: #0b0b0c; --ink: #f4f4f1; --soft: #8d8d88; --track: #232322; --accent: #2bd576; }
  :root[data-theme="light"] { --ground: #f6f6f3; --ink: #0b0b0c; --soft: #6b6b66; --track: #e3e3dd; --accent: #0a8a4a; }
  html, body { margin: 0; background: var(--ground); }
  body > div { display: none; background: var(--ground); color: var(--ink);
    font-family: "Google Sans Flex", system-ui, sans-serif; font-optical-sizing: auto; box-sizing: border-box; }
  body[data-view="banner"] #banner, body[data-view="logo"] #logo, body[data-view="social"] #social { display: grid; }
  #banner { width: 1280px; height: 400px; padding: 0 88px; grid-template-columns: 300px 1fr; align-items: center; gap: 64px; }
  #logo { width: 512px; height: 512px; place-items: center; }
  #social { width: 1280px; height: 640px; padding: 0 112px; grid-template-columns: 380px 1fr; align-items: center; gap: 80px; }
  h1 { margin: 0; font-weight: 640; letter-spacing: -.045em; line-height: .9; font-variation-settings: "opsz" 144; }
  #banner h1 { font-size: 136px; }
  #social h1 { font-size: 150px; }
  p { margin: 30px 0 0; font-weight: 420; line-height: 1.3; }
  #banner p { font-size: 30px; }
  #social p { font-size: 34px; max-width: 22ch; }
  p span { color: var(--soft); }
  svg { display: block; overflow: visible; }
  .track { fill: none; stroke: var(--track); }
  .run { fill: none; stroke: var(--ink); stroke-linecap: round; }
  .head { fill: var(--ink); }
  .exit { fill: none; stroke: var(--accent); stroke-linecap: round; }
  .kept { fill: var(--accent); }
  .stop { fill: var(--ground); stroke: var(--ink); }
</style>
</head>
<body>
<div id="banner">
  <svg class="mark" width="300" height="300" viewBox="-150 -150 300 300" aria-hidden="true"></svg>
  <div>
    <h1>keeploop</h1>
    <p>Propose. Build. Audit. <span>Keep only what is proven better.</span></p>
  </div>
</div>
<div id="logo">
  <svg class="mark" width="400" height="400" viewBox="-150 -150 300 300" role="img" aria-label="keeploop"></svg>
</div>
<div id="social">
  <svg class="mark" width="380" height="380" viewBox="-150 -150 300 300" aria-hidden="true"></svg>
  <div>
    <h1>keeploop</h1>
    <p>Your AI team proposes, builds and audits. <span>Only what beats the metric is kept.</span></p>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get("theme") || "dark";
  document.body.dataset.view = q.get("view") || "banner";

  // The mark: a loop running clockwise with four stops (propose, build, audit,
  // learn). At the bottom right it breaks open and one path leaves the loop:
  // the change that is kept.
  const NS = "http://www.w3.org/2000/svg";
  const R = 96, W = 26;                       // loop radius and stroke width
  const pt = (deg, r = R) => { const a = (deg - 90) * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; };
  const arc = (from, to) => {                 // clockwise arc, degrees from 12 o'clock
    const [x0, y0] = pt(from), [x1, y1] = pt(to);
    return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${R} ${R} 0 ${to - from > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  const add = (svg, tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    svg.appendChild(n); return n;
  };

  for (const svg of document.querySelectorAll("svg.mark")) {
    // the loop runs clockwise and opens at the top right
    const start = 74, end = 360 + 2;
    add(svg, "path", { d: arc(start, end), class: "run", "stroke-width": W });

    // a chevron at the end of the run, drawn with the same stroke
    const [ex, ey] = pt(end), t = end * Math.PI / 180;
    const tx = Math.cos(t), ty = Math.sin(t), nx = -ty, ny = tx;   // tangent, normal
    const tip = [ex + tx * 16, ey + ty * 16];
    const arm = (s) => [tip[0] - tx * 30 + s * nx * 30, tip[1] - ty * 30 + s * ny * 30];
    add(svg, "path", { d: `M ${arm(1)} L ${tip} L ${arm(-1)}`, class: "run",
                       "stroke-width": W * .9, "stroke-linejoin": "round" });

    // the kept change: where the loop opens, one result is held
    const [kx, ky] = pt(38);
    add(svg, "circle", { cx: kx, cy: ky, r: 23, class: "kept" });
  }
</script>
</body>
</html>
