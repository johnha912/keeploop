name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]  # requires-python >=3.10: every minor we support
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # the suite drives git commits in temp repos
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: python -m unittest discover -s tests -v

  # The release gate: build sdist + wheel, check their contents, install the wheel
  # in a clean venv and run kl init -> kl begin -> kl status on the installed kl.
  dist:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.2
      - run: python tools/check_dist.py

  # The golden gate: the noisy-eval proof run (25 seeds x 2 keep laws) must give
  # exactly the keeps, discards and scores committed in docs/proof/proof.json.
  # Merge and release time only; never part of a loop cycle.
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: python tools/proof_run.py --check
