# Release: push the tag vX.Y.Z (it must equal prepare.__version__) and this runs once:
#   gate (build, twine check, tools/check_dist.py) -> upload to PyPI -> install it back
#   from PyPI with pip and pipx on Linux and Windows and smoke-test -> GitHub Release
#   with the CHANGELOG section as notes.
# Rehearsal: run it by hand (Actions -> publish -> Run workflow). It builds X.Y.Z.devN
# (N = run number, so a rehearsal never uses up a real version) and goes to TestPyPI.
# Uploads use Trusted Publishing (OIDC), no token: PyPI and TestPyPI each need a
# publisher for this repo, workflow publish.yml, environment pypi / testpypi.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
  PYTHONUTF8: "1"   # Windows runners default to cp1252; the repo's files are UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        name: Version (tag must match prepare.__version__)
        run: |
          V=$(python -c "import prepare; print(prepare.__version__)")
          if [ "$REHEARSAL" = "true" ]; then
            V="$V.dev${{ github.run_number }}"
            python - "$V" <<'PY'
          import re, sys, pathlib
          p = pathlib.Path("prepare.py")
          p.write_text(re.sub(r'__version__ = "[^"]+"', f'__version__ = "{sys.argv[1]}"', p.read_text(encoding="utf-8")), encoding="utf-8")
          PY
          elif [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "tag $GITHUB_REF_NAME does not match prepare.__version__ $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: python tools/release_notes.py "$(python -c 'import prepare; print(prepare.__version__.split(".dev")[0])')" > /dev/null
      - run: python -m pip install build==1.2.2 twine==6.1.0
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: python tools/check_dist.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  verify:
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      V: ${{ needs.build.outputs.version }}
      INDEX: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/simple/' || 'https://pypi.org/simple/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Same version as the build (rehearsal)
        run: |
          python - "$V" <<'PY'
          import re, sys, pathlib
          p = pathlib.Path("prepare.py")
          p.write_text(re.sub(r'__version__ = "[^"]+"', f'__version__ = "{sys.argv[1]}"', p.read_text(encoding="utf-8")), encoding="utf-8")
          PY
      - name: pip install from the index, then the smoke test
        run: python tools/check_dist.py --from-index "keeploop==$V" --index-url "$INDEX"
      - name: pipx install from the index, then the smoke test
        run: |
          pipx install --index-url "$INDEX" "keeploop==$V"
          python tools/check_dist.py --kl "$(pipx environment --value PIPX_BIN_DIR)/kl"

  release:
    if: github.event_name == 'push'
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/release_notes.py "${{ needs.build.outputs.version }}" > notes.md
      # A tag made from the GitHub Releases page (e.g. on a phone) already has a
      # release: fill in its title and notes instead of failing on "already exists".
      - run: |
          TITLE="keeploop ${{ needs.build.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
