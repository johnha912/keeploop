<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>keeploop: the keep gate</title>
<!-- README animation, Fig. 2: "the keep gate". A static number line: the best, a yellow
     noise band up to the bar at best + 2σ. Three real changes from the proof run, one
     settled scene each, joined by instant cuts (the one motion): inside the band is
     reset; past the bar, twice, is committed and the next scene shows the new best and
     bar. Nothing moves inside a scene. The loop opens and closes on the bare figure.
     tools/render_figure.py fills DATA and screenshots render(t). Build-time only. No
     result is typed here: every number is set from DATA. -->
<style>
:root { --cream: #f4efe4; --ink: #151515; --ink2: #5b574f; --muted: #9a958a; --sun: #ffd23f;
  --sun-edge: #e0b000; --go: #12804c; --stop: #e0502c; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--cream); }
body { width: 1280px; height: 620px; overflow: hidden; color: var(--ink);
  font-family: "Inter Display", Inter, "Liberation Sans", sans-serif; position: relative; }
.brand { position: absolute; left: 44px; top: 34px; display: flex; align-items: center; gap: 10px;
  font: 800 24px "Inter Display", Inter, sans-serif; letter-spacing: -0.5px; }
.law { position: absolute; right: 44px; top: 38px; font: 600 15px "JetBrains Mono", monospace; color: var(--ink2); }
.law b { background: var(--sun); padding: 2px 7px; color: var(--ink); }
.say { position: absolute; left: 44px; top: 88px; width: 1190px; font-weight: 900; font-size: 50px;
  line-height: 1.05; letter-spacing: -1.6px; }
.cap { position: absolute; left: 44px; right: 44px; top: 532px; padding-top: 10px; border-top: 1.5px solid #d8d0bf;
  font: 16px/1.3 "Inter Display", Inter, sans-serif; color: var(--ink2); }
.cap b { color: var(--ink); font-weight: 800; }
.foot { position: absolute; left: 44px; right: 44px; bottom: 22px; display: flex; justify-content: space-between;
  font: 13.5px "JetBrains Mono", monospace; color: var(--muted); }
svg { position: absolute; left: 0; top: 0; }
svg text { font-family: "JetBrains Mono", monospace; }
</style></head>
<body>
<div class="brand"><svg width="30" height="30" viewBox="0 0 34 34" style="position:static"><path d="M24.5 8.5 A11 11 0 1 0 28 17" fill="none" stroke="#151515" stroke-width="4.2" stroke-linecap="round"/><path d="M19 4.5 L25 8.5 L20 13.5" fill="none" stroke="#151515" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29.5" cy="11" r="3.6" fill="#12804c"/></svg>keeploop</div>
<div class="law">keep only above <b>best + 2σ</b>, measured twice</div>
<div class="say" id="say"></div>
<svg id="s" width="1280" height="620"></svg>
<div class="cap"><b>Fig. 2</b> — The keep gate on a real noisy-eval run: inside the band is reset, past the bar is kept.</div>
<div class="foot"><span id="src"></span><span>pipx install keeploop</span></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const NS = "http://www.w3.org/2000/svg";
const C = { ink: "#151515", ink2: "#5b574f", muted: "#9a958a", sun: "#ffd23f", sunEdge: "#e0b000",
  go: "#12804c", stop: "#e0502c", card: "#fffdf7", cream: "#f4efe4" };
function el(p, tag, a, txt) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]);
  if (txt !== undefined) e.textContent = txt; p.appendChild(e); return e; }
const f3 = x => x.toFixed(3);
const sig = D.run.sigma, beats = D.readme.beats, T = D.readme.timeline;
const S = document.getElementById("s");
document.getElementById("say").textContent = D.readme.headline;
document.getElementById("src").textContent =
  `real run · examples/noisy-eval, seed ${D.run.seed} · σ = ${sig.toFixed(4)} · numbers: docs/proof`;

// the number line (never moves)
const lo = D.readme.lo, hi = D.readme.hi, AX = 462, X0 = 70, X1 = 1210, W = 1280;
const X = v => X0 + (v - lo) / (hi - lo) * (X1 - X0);
const BAND_TOP = 312, LAB_Y = 302, PAD = 14, EDGE = 24;
const band = el(S, "rect", { y: BAND_TOP, height: AX - BAND_TOP, fill: C.sun, stroke: C.sunEdge, "stroke-width": 1.5 });
const bandT = el(S, "text", { y: AX - 14, "font-size": 15, fill: C.ink, "font-weight": 700 }, "noise band");
el(S, "line", { x1: X0 - 20, x2: X1 + 20, y1: AX, y2: AX, stroke: C.ink, "stroke-width": 3 });
for (let v = Math.ceil(lo * 100) / 100; v <= hi + 1e-9; v += 0.01) {
  el(S, "line", { x1: X(v), x2: X(v), y1: AX, y2: AX + 9, stroke: C.ink, "stroke-width": 2 });
  el(S, "text", { x: X(v), y: AX + 30, "font-size": 15, fill: C.ink2, "text-anchor": "middle" }, v.toFixed(2));
}
// best: line with its label to the left; bar: dashed line with its label to the right
const bestL = el(S, "line", { y1: BAND_TOP - 6, y2: AX + 4, stroke: C.ink, "stroke-width": 5 });
const bestT = el(S, "text", { y: LAB_Y, "font-size": 16, "font-weight": 700, fill: C.ink, "text-anchor": "end" });
const barL = el(S, "line", { y1: BAND_TOP - 6, y2: AX + 4, stroke: C.ink, "stroke-width": 2.5, "stroke-dasharray": "7 6" });
const barT = el(S, "text", { y: LAB_Y, "font-size": 16, "font-weight": 700, fill: C.ink, "text-anchor": "start" });

// one callout per scene, built once; a scene shows exactly one of them, or none
function callout(b) {
  const keep = b.verdict === "keep", col = keep ? C.go : C.stop, x = X(b.score);
  const g = el(S, "g", { display: "none" });
  g.pin = el(g, "line", { x1: x, x2: x, y2: AX, stroke: C.ink, "stroke-width": 2 });
  if (b.rerun !== null) {   // the confirm re-run: a ring on the axis, labelled to its left
    const xr = X(b.rerun);
    el(g, "circle", { cx: xr, cy: AX, r: 9, fill: "none", stroke: col, "stroke-width": 3 });
    el(g, "text", { x: xr - 16, y: AX - 14, "font-size": 14, fill: C.ink, "text-anchor": "end" }, `re-run ${f3(b.rerun)}`);
  }
  el(g, "circle", { cx: x, cy: AX, r: 9, fill: col });
  g.box = el(g, "rect", { rx: 12, fill: keep ? "#e3f2e8" : "#fbe3da", stroke: col, "stroke-width": 2.5 });
  g.t1 = el(g, "text", { "font-size": 14, fill: C.ink2 }, `cycle ${b.cycle} · ${b.score_label}`);
  g.t2 = el(g, "text", { "font-size": 19, "font-weight": 700, fill: C.ink }, b.change);
  g.t3 = el(g, "text", { "font-size": 22, "font-weight": 800, fill: col,
    "font-family": "Inter Display, Inter, sans-serif", "letter-spacing": "1" }, keep ? "COMMIT" : "RESET");
  g.b = b; g.x = x;
  return g;
}
const calls = beats.map(callout);
function layout(g) {   // padded box above the axis; flips left when it would run within EDGE of the right edge
  const w = Math.ceil(Math.max(g.t1.getComputedTextLength(), g.t2.getComputedTextLength(),
    g.t3.getComputedTextLength())) + 2 * PAD, h = 104, top = 172;
  let left = g.x - 24;
  if (left + w > W - EDGE) left = g.x + 24 - w;
  g.box.setAttribute("x", left); g.box.setAttribute("y", top);
  g.box.setAttribute("width", w); g.box.setAttribute("height", h);
  [[g.t1, 28], [g.t2, 57], [g.t3, 90]].forEach(([e, dy]) => { e.setAttribute("x", left + PAD); e.setAttribute("y", top + dy); });
  g.pin.setAttribute("y1", top + h);
}
function setBest(b) {   // settled values; the band label sits where no pin crosses it
  const bar = b + 2 * sig, x0 = X(b), x1 = X(bar);
  band.setAttribute("x", x0); band.setAttribute("width", x1 - x0);
  bestL.setAttribute("x1", x0); bestL.setAttribute("x2", x0); bestT.setAttribute("x", x0 - 8); bestT.textContent = `best ${f3(b)}`;
  barL.setAttribute("x1", x1); barL.setAttribute("x2", x1); barT.setAttribute("x", x1 + 8); barT.textContent = `bar ${f3(bar)}`;
  return [x0, x1];
}
function render(t) {
  let i = -1;   // which scene: -1 is the bare figure that opens and closes the loop
  T.scenes.forEach((s, k) => { if (t >= s[0] && t < s[1]) i = k; });
  const b = beats[i], [x0, x1] = setBest(b ? b.best : beats[0].best);
  calls.forEach((g, k) => { g.setAttribute("display", k === i ? "inline" : "none"); if (k === i) layout(g); });
  const lw = bandT.getComputedTextLength(), pin = b ? X(b.score) : -1e9;
  let lx = x1 - 10 - lw;
  if (pin >= lx - 10 && pin <= lx + lw + 10) lx = x0 + 10;
  bandT.setAttribute("x", lx);
}
window.render = render;
render(0);
</script>
</body></html>
